name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # BLOCKING. Every PHP file must parse on PHP 8.3 (the Atomic runtime).
  # ---------------------------------------------------------------------------
  php-lint:
    name: PHP syntax lint (8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Lint every PHP file
        run: |
          set -euo pipefail
          find theme tools -name '*.php' -print0 \
            | xargs -0 -P8 -n1 -- php -l

      # A reformat gate is only worth anything if it can still REJECT something. This
      # runs the self-test on every pull request, inside a job that is already a
      # required check, so a change that quietly weakens the gate cannot merge. It
      # costs about a second and needs no dependencies.
      #
      # ⚠️ SCOPE, STATED HONESTLY: this covers assert-token-changes-expected.php only -
      # every one of its cases runs `--stage 2 --pairs`. assert-token-stream-unchanged.php
      # is a separate implementation and is NOT exercised here; it is exercised by every
      # Stage 1 dispatch of phpcbf.yml, where it has to pass against a real patch. An
      # earlier version of this comment said "the token gates", which claimed twice the
      # coverage that exists.
      #
      # ⚠️ It is deliberately in the BLOCKING lint job rather than a new job of its
      # own: adding a job would add a 6th required check, and branch protection lists
      # the five by name - a new one would be non-blocking by default and this would
      # become advisory without anyone deciding that.
      - name: Prove the classified token gate still rejects regressions
        run: php .github/scripts/test-token-gate.php

  # ---------------------------------------------------------------------------
  # BLOCKING. Verified 0 findings on PHP 8.3 (CI run 2026-06-18), so this gate
  # is enforced. PHPCompatibilityWP accounts for WordPress core polyfills.
  # ---------------------------------------------------------------------------
  php-compatibility:
    name: PHP 8.3+ compatibility (PHPCompatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up PHP 8.3 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPCompatibility (testVersion 8.3-)
        run: composer compat -- --report-full --report-checkstyle=phpcompat-report.xml
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpcompat-report
          path: phpcompat-report.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # BLOCKING on NEW issues. The 45 inherited findings are captured in
  # phpstan-baseline.neon; analysis fails only on regressions. Regenerate the
  # baseline with `composer analyse:baseline`. See docs/CI.md.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static analysis (PHPStan + WordPress stubs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up PHP 8.3 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan (level 5, baselined)
        run: composer analyse -- --error-format=github

  # ---------------------------------------------------------------------------
  # Security sniffs are BLOCKING (0 findings after the Phase 3 security pass,
  # 2026-06-18) — this gate prevents any NEW unescaped-output / unsanitized-input
  # / missing-nonce regression. The full WordPress-Extra style check stays
  # ADVISORY: the ~12K-LOC fork still reports thousands of cosmetic findings
  # (spacing, Yoda, alignment); its report is uploaded for incremental cleanup.
  # ---------------------------------------------------------------------------
  coding-standards:
    name: Coding standards + security (PHPCS WordPress-Extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up PHP 8.3 + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Security sniffs (BLOCKING — escaping, nonces, input validation)
        # EscapeOutput (XSS), NonceVerification (CSRF), and ValidatedSanitizedInput
        # ($_POST unslash + sanitize) are all at 0 after the Phase 3 passes and are
        # enforced here to block any regression.
        run: |
          vendor/bin/phpcs theme/braillewright tools \
            --standard=WordPress \
            --sniffs=WordPress.Security.EscapeOutput,WordPress.Security.NonceVerification,WordPress.Security.ValidatedSanitizedInput \
            --extensions=php \
            --ignore=*/tgm/*,*/languages/*,*/lib/plugin-update-checker/*
      - name: Full coding standards (advisory)
        continue-on-error: true
        run: composer lint -- --report-full --report-checkstyle=phpcs-report.xml
      - name: Upload PHPCS report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpcs-report
          path: phpcs-report.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Accessibility: WordPress (wp-env, PHP 8.3) with the theme + plugin active,
  # scanned with axe + HTML_CodeSniffer (pa11y-ci) and Lighthouse. Gates the
  # THEME/PLUGIN template-level a11y; TTT content/widget defects are a separate,
  # content-safety concern. pa11y-ci is BLOCKING as of 2026-06-18 — 0 errors
  # across Phase 2 + PRs #2/#3/#4 (home + post + page). Lighthouse stays advisory
  # (its a11y score can vary by environment/run).
  # ---------------------------------------------------------------------------
  accessibility:
    name: Accessibility (wp-env + axe/pa11y + Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      # Fast structural gates. Both run BEFORE wp-env so a drifted or missing
      # asset fails in seconds rather than after a full WordPress boot.
      # Added 2026-08-14 after two defects that no existing gate could catch:
      #   * features/styles/rtl.min.css was enqueued for RTL sites but did not
      #     exist -- invisible to pa11y, which only ever loads an LTR page.
      #   * style.min.css was two months stale and still carried the
      #     `outline:0` focus defect that was fixed in the source back in June.
      - name: Minified stylesheets match their sources [BLOCKING]
        run: node tools/build-css.js --check
      - name: Every enqueued asset exists on disk [BLOCKING]
        run: python -X utf8 tools/check-enqueued-assets.py
      # Added 2026-08-25. The check above asks "does every enqueued FILE exist?";
      # this one asks the inverse -- "is every handle we attach inline CSS to actually
      # registered?" -- which is what was missing. braillewright-style-rtl was a
      # wp_add_inline_style() target in seven files and was never enqueued anywhere.
      # wp_add_inline_style() does nothing at all on an unregistered handle: no notice,
      # no warning, no error, even with WP_DEBUG on.
      - name: Every inline-style handle is registered [BLOCKING]
        run: python -X utf8 tools/check-inline-style-handles.py
      - name: Start wp-env (WordPress + PHP 8.3; theme mounted)
        run: npx wp-env start
      - name: Activate theme
        run: npx wp-env run cli wp theme activate braillewright
      - name: pa11y-ci (WCAG2AA — axe + HTML_CodeSniffer) [BLOCKING]
        run: npx pa11y-ci --json > pa11y-report.json
      - name: Lighthouse CI (accessibility category)
        continue-on-error: true
        run: npx lhci autorun
      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-reports
          path: |
            pa11y-report.json
            .lighthouseci/
          if-no-files-found: ignore
      - name: Stop wp-env
        if: always()
        run: npx wp-env stop

  # ---------------------------------------------------------------------------
  # DEPLOY ARTIFACT (native WordPress.com GitHub Deployments).
  # Packages theme/braillewright/ as the artifact named `wpcom` that WordPress.com
  # advanced deployments look for. Gated so it runs ONLY after every test gate
  # above passes (needs:) AND only on a push to main (if:) — so the native
  # auto-deploy to TTT staging can never ship code that failed CI, and PRs never
  # produce a deploy artifact. WordPress.com (Advanced mode, pointed at this
  # workflow) deploys this artifact's contents into the configured destination
  # /wp-content/themes/braillewright. Artifact root = the theme's contents
  # (style.css at the root), verified against the live deploy.
  # ---------------------------------------------------------------------------
  package-theme:
    name: Package theme for WordPress.com (wpcom artifact)
    needs: [php-lint, php-compatibility, static-analysis, coding-standards, accessibility]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upload theme/braillewright as the wpcom artifact
        uses: actions/upload-artifact@v7
        with:
          name: wpcom
          path: theme/braillewright
          retention-days: 1
